services:
  postgres:
    image: postgres:17-alpine
    container_name: personalcontrol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personalcontrol}
      POSTGRES_USER: ${POSTGRES_USER:-personalcontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-personalcontrol}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-personalcontrol} -d ${POSTGRES_DB:-personalcontrol}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
